name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  TURBO_TELEMETRY_DISABLED: 1
jobs:
  quality:
    # Portable PostgreSQL ships a Windows runtime; Linux bundle requires unavailable ICU60.
    # Keep the complete storage/parity suite on the supported runner, without skips.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm build
      - name: Build real Native Transport fixture for the quality gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .artifacts | Out-Null
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --no-run --message-format=json > .artifacts/ci-native-fixture.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fixtures = @(Get-Content .artifacts/ci-native-fixture.jsonl | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.executable -and $_.target.name -eq 'arclattice_lib' })
          if ($fixtures.Count -ne 1) { throw 'Expected exactly one current native test executable' }
          "ATLAS_NATIVE_TEST_EXE=$($fixtures[0].executable)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'NO_PROXY=127.0.0.1,localhost,::1' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: pnpm check
  browser:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-en, desktop-zh, mobile-zh]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project ${{ matrix.project }} --retries=1 --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: qa-results.json
          NO_PROXY: 127.0.0.1,localhost,::1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.project }}
          path: |
            qa-results.json
            test-results/**/trace.zip
            test-results/**/error-context.md
          retention-days: 7

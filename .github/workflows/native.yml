name: Installed Windows upgrade verification
on:
  workflow_dispatch:
    inputs:
      draft:
        description: Candidate release ID
        required: true
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Obtain installers from the official releases
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.draft }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[0-9]+$ ]]
          mkdir installers
          gh release download v3.2.2 --repo "$GITHUB_REPOSITORY" -p '*windows-x64-setup.exe*' -D installers
          gh api "repos/$GITHUB_REPOSITORY/releases/$CANDIDATE" > "$RUNNER_TEMP/draft.json"
          jq -e '.tag_name=="v3.2.3" and .draft==true' "$RUNNER_TEMP/draft.json"
          for suffix in "" ".sig"; do
            name="OrivaneAtlas-3.2.3-windows-x64-setup.exe$suffix"
            id=$(jq -er --arg name "$name" '.assets[] | select(.name==$name) | .id' "$RUNNER_TEMP/draft.json")
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "installers/$name"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows-packages
          path: installers
          retention-days: 1
  upgrade:
    needs: packages
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: signed-windows-packages
          path: installers
      - name: Install 3.2.2 then upgrade the same installation and open its profile
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dest=Join-Path $env:RUNNER_TEMP 'AtlasUpgrade'
          $profilePath=Join-Path $env:RUNNER_TEMP 'AtlasUpgradeProfile'
          foreach ($v in '3.2.2','3.2.3') {
            $installer=(Resolve-Path "installers/OrivaneAtlas-$v-windows-x64-setup.exe").Path
            node scripts/verify-updater-signature.mjs $installer
            if ($LASTEXITCODE) {throw 'Invalid updater signature'}
            $phase=if($v -eq '3.2.2'){'before'}else{'after'}
            $opts=if($phase -eq 'before'){@('/S',"/D=$dest")}else{@('/S','/UPDATE',"/D=$dest")}
            $p=Start-Process -FilePath $installer -ArgumentList $opts -WindowStyle Hidden -PassThru -Wait
            if($p.ExitCode -ne 0){throw "Installer exit $($p.ExitCode)"}
            $app=(Get-Item -LiteralPath (Join-Path $dest 'arclattice.exe'))
            if ($app.VersionInfo.ProductVersion -ne $v) {throw "Installed version $($app.VersionInfo.ProductVersion), expected $v"}
            node scripts/verify-323-installed.mjs $app.FullName $phase $profilePath
            if ($LASTEXITCODE) {throw 'Installed app verification failed'}
          }

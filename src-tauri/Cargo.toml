[package]
name = "arclattice"
version = "0.0.4"
description = "Orivane Atlas connected desktop client"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "arclattice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target."cfg(windows)".dependencies]
tauri-plugin-updater = "2.11.0"

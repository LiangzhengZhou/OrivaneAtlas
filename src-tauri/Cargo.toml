[package]
name = "arclattice"
version = "2.4.0"
description = "Orivane Atlas connected desktop client"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "arclattice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
base64 = "0.22"
sha2 = "0.10.9"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }

[target."cfg(windows)".dependencies]
tauri-plugin-updater = "2.11.0"
tauri = { version = "2", features = ["tray-icon"] }
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[target."cfg(windows)".dependencies.windows]
version = "0.61.3"
features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"]

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
